services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  web:
    networks:
      - backend
  worker:
    networks:
      - backend
