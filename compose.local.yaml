services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caed_permissions}
      POSTGRES_USER: ${POSTGRES_USER:-caed_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caed_app} -d ${POSTGRES_DB:-caed_permissions}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  migrate:
    depends_on:
      db:
        condition: service_healthy

  web:
    ports:
      - "8000:8000"
    networks:
      - backend
      - edge
    read_only: false
    volumes:
      - ./:/app

  worker:
    read_only: false
    volumes:
      - ./:/app
